name: QA area personale e corsi (locale isolata)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  member-qa:
    if: github.event.pull_request.head.ref == 'fix/area-personale-iscrizioni-brevetti' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      EMAIL_AUTOMATIC_NOTIFICATIONS: 'false'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: qa-placeholder-not-a-credential
      MEMBER_QA_LOCAL_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - name: Genera migrazione con CLI senza connessione
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new --help
          shopt -s nullglob
          files=(supabase/migrations/*_area_personale_iscrizioni_brevetti.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            supabase migration new area_personale_iscrizioni_brevetti
            files=(supabase/migrations/*_area_personale_iscrizioni_brevetti.sql)
            test "${#files[@]}" -eq 1
            cp scripts/qa-area-personale-iscrizioni-brevetti.sql "${files[0]}"
          else
            test "${#files[@]}" -eq 1
            cmp scripts/qa-area-personale-iscrizioni-brevetti.sql "${files[0]}"
          fi
          printf 'GENERATED_MIGRATION=%s\n' "${files[0]}"
          sha256sum "${files[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: member-patch-migration
          path: supabase/migrations/*_area_personale_iscrizioni_brevetti.sql
          if-no-files-found: error
          retention-days: 7
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run check:source
      - run: npm run typecheck
      - run: npm run test:static
      - run: npm run build
      - name: Database Supabase locale usa-e-getta
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/config.toml || supabase init
          supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
          supabase status -o env > /tmp/member-local.env
          set -a
          source /tmp/member-local.env
          set +a
          [[ "$API_URL" == http://127.0.0.1:* || "$API_URL" == http://localhost:* ]]
          [[ "$DB_URL" == *"@127.0.0.1:"* || "$DB_URL" == *"@localhost:"* ]]
          echo "::add-mask::$DB_URL"
          MEMBER_QA_DATABASE_URL="$DB_URL" node scripts/test-area-personale-iscrizioni-brevetti.cjs
      - name: Arresta il database locale
        if: always()
        run: supabase stop --no-backup || true
