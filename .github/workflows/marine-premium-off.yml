name: Marine Premium 3.2 - QA locale OFF-OFF
on:
  pull_request:
    branches: ['fix/3.1-course-duplicate-cleanup']
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: marine-premium-off-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.head_ref == 'feature/gestionale-3.2-marine-premium' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QA_ISOLATED_ENV: 'true'
      SESTO_TEST_MODE: 'true'
      SESTO_EMAIL_MODE: simulate
      QA_BASE_URL: http://127.0.0.1:3314
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3314
      QA_BASELINE_URL: http://127.0.0.1:3315
      NEXT_TELEMETRY_DISABLED: '1'
      SC_STRUCTURAL_RPC: 'false'
      SC_STRUCTURAL_RPC_RELEASE: 'false'
      QA_RPC_MODE: OFF/OFF
      QA_BASELINE_SHA: 38e27a88aa8de7369e0d7c3578aa585542ad7cd4
      QA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Dipendenze e browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Avvia solo Supabase locale
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ] && [ ! -f supabase/config.jsonc ]; then supabase init; fi
          if [ ! -f supabase/config.toml ]; then supabase config convert --to toml; fi
          python3 scripts/qa-local-status.py --self-test
          python3 scripts/qa-local-config.py
          supabase start > "$RUNNER_TEMP/sesto-supabase-start.log" 2>&1 || { echo "Avvio/migrazioni Supabase locale non riusciti"; exit 1; }
          status=$(mktemp)
          chmod 600 "$status"
          trap 'rm -f "$status"' EXIT
          supabase status --output env > "$status"
          work=$(mktemp -d "$RUNNER_TEMP/sesto-qa.XXXXXX")
          chmod 700 "$work"
          python3 scripts/qa-local-status.py "$status" "$work"
      - name: Build e avvio candidato OFF
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QA_HEAD_SHA"
          node scripts/qa-local-supabase.mjs seed
          npm run build
          export QA_DB_LATENCY_MS=40
          export NODE_OPTIONS="${NODE_OPTIONS:-} --require=$GITHUB_WORKSPACE/scripts/qa-latency.cjs"
          npm run start -- --hostname 127.0.0.1 --port 3314 > "$RUNNER_TEMP/sesto-qa-next.log" 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3314/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Sessioni e browser autenticati
        run: |
          set -euo pipefail
          node scripts/qa-local-supabase.mjs sessions
          export QA_STAFF_STATE="$QA_WORK_DIR/staff.json"
          export QA_SECRETARY_STATE="$QA_WORK_DIR/secretary.json"
          export QA_MEMBER_STATE="$QA_WORK_DIR/member.json"
          export QA_INSTRUCTOR_STATE="$QA_WORK_DIR/instructor.json"
          export QA_BOARD_STATE="$QA_WORK_DIR/board.json"
          export QA_APPLICANT_STATE="$QA_WORK_DIR/applicant.json"
          export QA_FIXTURE_IDS=$(cat "$QA_WORK_DIR/fixtures.json")
          npm run test:browser -- --project='*-staff' --project='*-secretary' --project='*-member' --project='*-instructor' --project='*-board' --project='*-applicant'
          QA_STRUCTURAL_DISABLED_URL=http://127.0.0.1:3314 node scripts/qa-structural-disabled.mjs
      - name: Mutazioni e sei schermate reali con email sintetica
        env:
          QA_MARINE_VISUAL_DIR: ${{ runner.temp }}/marine-public-${{ github.run_id }}
        run: |
          node scripts/qa-local-supabase.mjs mutations
          node scripts/qa-local-supabase.mjs auth
      - name: Screenshot sintetici
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marine-public-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/marine-public-${{ github.run_id }}/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Screenshot area riservata e reflow per ruolo
        env:
          QA_MARINE_PRIVATE_DIR: ${{ runner.temp }}/marine-private-${{ github.run_id }}
        run: |
          node scripts/qa-local-supabase.mjs visual-fixtures
          node scripts/qa-marine-private.mjs
      - name: Conserva screenshot area riservata sintetica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marine-private-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/marine-private-${{ github.run_id }}/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Rimuovi esclusivamente fixture visuale locale
        run: node scripts/qa-local-supabase.mjs visual-fixtures-cleanup
      - name: Dataset di carico
        run: node scripts/qa-local-supabase.mjs performance
      - name: Build baseline 3.1 esatta e avvio OFF
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/sesto-baseline"
          git worktree add --detach "$baseline" "$QA_BASELINE_SHA"
          echo "QA_BASELINE_DIR=$baseline" >> "$GITHUB_ENV"
          cd "$baseline"
          test "$(git rev-parse HEAD)" = "$QA_BASELINE_SHA"
          npm ci --no-audit --no-fund
          npm run build
          export QA_DB_LATENCY_MS=40
          export NODE_OPTIONS="${NODE_OPTIONS:-} --require=$GITHUB_WORKSPACE/scripts/qa-latency.cjs"
          npm run start -- --hostname 127.0.0.1 --port 3315 > "$RUNNER_TEMP/sesto-qa-baseline.log" 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3315/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Benchmark OFF-OFF e verifica assenza marker
        run: |
          set -euo pipefail
          QA_STRUCTURAL_DISABLED_URL=http://127.0.0.1:3315 node scripts/qa-structural-disabled.mjs
          QA_DB_LATENCY_MS=40 node scripts/qa-performance-compare.mjs
          grep -q 'QA_LATENCY_ACTIVE 40ms' "$RUNNER_TEMP/sesto-qa-next.log"
          grep -q 'QA_LATENCY_ACTIVE 40ms' "$RUNNER_TEMP/sesto-qa-baseline.log"
          if grep -q 'QA_STRUCTURAL_RPC_USED' "$RUNNER_TEMP/sesto-qa-next.log" "$RUNNER_TEMP/sesto-qa-baseline.log"; then exit 1; fi
      - name: Report benchmark aggregato
        uses: actions/upload-artifact@v4
        with:
          name: marine-off-off-${{ github.event.pull_request.head.sha }}
          path: ${{ env.QA_WORK_DIR }}/performance-comparison.json
          if-no-files-found: error
          retention-days: 14
      - name: Pulizia servizi e dati sintetici
        if: always()
        run: |
          if [ -n "${QA_WORK_DIR:-}" ] && [[ "$QA_WORK_DIR" == "$RUNNER_TEMP"/sesto-qa.* ]]; then rm -rf "$QA_WORK_DIR"; fi
          supabase stop --no-backup >/dev/null 2>&1 || true
