name: QA comparativa prestazioni 3.1 (locale)
on:
  push:
    branches: ['release/gestionale-3.1', 'perf/3.1-next-pass', 'perf/3.1-structural', 'perf/3.1-navigation']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: performance-3-1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    if: github.ref == 'refs/heads/release/gestionale-3.1' || github.ref == 'refs/heads/perf/3.1-next-pass' || github.ref == 'refs/heads/perf/3.1-structural' || github.ref == 'refs/heads/perf/3.1-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_ISOLATED_ENV: 'true'
      SESTO_TEST_MODE: 'true'
      SESTO_EMAIL_MODE: simulate
      QA_BASE_URL: http://127.0.0.1:3314
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3314
      QA_BASELINE_URL: http://127.0.0.1:3315
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Dipendenze e browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Avvia solo Supabase locale
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ] && [ ! -f supabase/config.jsonc ]; then supabase init; fi
          if [ ! -f supabase/config.toml ]; then supabase config convert --to toml; fi
          python3 scripts/qa-local-status.py --self-test
          python3 scripts/qa-local-config.py
          supabase start > "$RUNNER_TEMP/sesto-supabase-start.log" 2>&1 || { echo "Avvio/migrazioni Supabase locale non riusciti"; exit 1; }
          status=$(mktemp)
          chmod 600 "$status"
          trap 'rm -f "$status"' EXIT
          supabase status --output env > "$status"
          work=$(mktemp -d "$RUNNER_TEMP/sesto-qa.XXXXXX")
          chmod 700 "$work"
          python3 scripts/qa-local-status.py "$status" "$work"
      - name: Installa esclusivamente i prototipi SQL locali
        if: github.ref == 'refs/heads/perf/3.1-structural' || github.ref == 'refs/heads/perf/3.1-navigation'
        run: node scripts/qa-install-structural-rpc.mjs
      - name: Dataset e build del candidato
        run: |
          set -euo pipefail
          node scripts/qa-local-supabase.mjs seed
          npm run build
          if [[ "$GITHUB_REF" == 'refs/heads/perf/3.1-structural' || "$GITHUB_REF" == 'refs/heads/perf/3.1-navigation' ]]; then
            export SC_STRUCTURAL_RPC=true QA_DB_LATENCY_MS=40
            export NODE_OPTIONS="${NODE_OPTIONS:-} --require=$GITHUB_WORKSPACE/scripts/qa-latency.cjs"
          fi
          npm run start -- --hostname 127.0.0.1 --port 3314 > "$RUNNER_TEMP/sesto-qa-next.log" 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3314/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Login reali e test browser autenticati
        run: |
          set -euo pipefail
          node scripts/qa-local-supabase.mjs sessions
          export QA_STAFF_STATE="$QA_WORK_DIR/staff.json"
          export QA_SECRETARY_STATE="$QA_WORK_DIR/secretary.json"
          export QA_MEMBER_STATE="$QA_WORK_DIR/member.json"
          export QA_INSTRUCTOR_STATE="$QA_WORK_DIR/instructor.json"
          export QA_BOARD_STATE="$QA_WORK_DIR/board.json"
          export QA_APPLICANT_STATE="$QA_WORK_DIR/applicant.json"
          export QA_FIXTURE_IDS=$(cat "$QA_WORK_DIR/fixtures.json")
          npm run test:browser -- --project='*-staff' --project='*-secretary' --project='*-member' --project='*-instructor' --project='*-board' --project='*-applicant'
      - name: Mutazioni e autenticazione reali, solo sintetiche
        run: |
          node scripts/qa-local-supabase.mjs mutations
          node scripts/qa-local-supabase.mjs auth
      - name: Dataset sintetico di carico e controlli funzionali
        run: node scripts/qa-local-supabase.mjs performance
      - name: Build della baseline pubblicata sullo stesso runner
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/sesto-baseline"
          git worktree add --detach "$baseline" ebe1085b6dfd7b1b5660c3326baf8d4475819c5f
          echo "QA_BASELINE_DIR=$baseline" >> "$GITHUB_ENV"
          cd "$baseline"
          npm ci --no-audit --no-fund
          npm run build
          if [[ "$GITHUB_REF" == 'refs/heads/perf/3.1-structural' || "$GITHUB_REF" == 'refs/heads/perf/3.1-navigation' ]]; then
            export QA_DB_LATENCY_MS=40
            export NODE_OPTIONS="${NODE_OPTIONS:-} --require=$GITHUB_WORKSPACE/scripts/qa-latency.cjs"
          fi
          npm run start -- --hostname 127.0.0.1 --port 3315 > "$RUNNER_TEMP/sesto-qa-baseline.log" 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3315/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Benchmark comparativo delle pagine e dei bundle
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/perf/3.1-structural' || "$GITHUB_REF" == 'refs/heads/perf/3.1-navigation' ]]; then export QA_DB_LATENCY_MS=40; fi
          node scripts/qa-performance-compare.mjs
          if [[ "$GITHUB_REF" == 'refs/heads/perf/3.1-structural' || "$GITHUB_REF" == 'refs/heads/perf/3.1-navigation' ]]; then
            grep -q 'QA_LATENCY_ACTIVE 40ms' "$RUNNER_TEMP/sesto-qa-next.log"
            grep -q 'QA_LATENCY_ACTIVE 40ms' "$RUNNER_TEMP/sesto-qa-baseline.log"
            for rpc in dashboard soci-counts incassi-totals; do grep -q "QA_STRUCTURAL_RPC_USED $rpc" "$RUNNER_TEMP/sesto-qa-next.log"; done
            if [[ "$GITHUB_REF" == 'refs/heads/perf/3.1-navigation' ]]; then grep -q 'QA_STRUCTURAL_RPC_USED navigation-account' "$RUNNER_TEMP/sesto-qa-next.log"; fi
          fi
      - name: Conserva esclusivamente metriche aggregate
        uses: actions/upload-artifact@v4
        with:
          name: performance-comparison-${{ github.sha }}
          path: ${{ env.QA_WORK_DIR }}/performance-comparison.json
          if-no-files-found: error
          retention-days: 14
      - name: Rimuovi sessioni sintetiche e arresta servizi
        if: always()
        run: |
          if [ -n "${QA_WORK_DIR:-}" ] && [[ "$QA_WORK_DIR" == "$RUNNER_TEMP"/sesto-qa.* ]]; then rm -rf "$QA_WORK_DIR"; fi
          supabase stop --no-backup >/dev/null 2>&1 || true
