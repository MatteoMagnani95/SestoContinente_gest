name: Prepara migrazione corsi e calendario 3.1 (solo file)
on:
  push:
    branches: ['perf/3.1-migration-courses-calendar']
    paths: ['.github/workflows/prepare-course-calendar-migration.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Genera file canonico senza connessione al database
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new --help
          supabase migration new course_calendar_read_snapshots
          files=(supabase/migrations/*_course_calendar_read_snapshots.sql)
          test "${#files[@]}" -eq 1
          file="${files[0]}"
          test -f "$file"
          test "$(basename "$file")" \> "20261127122235_structural_read_snapshots.sql"
          { printf '%s\n' '-- 3.1: two additive read-only staff RPCs; activation remains restricted to isolated QA.'; sed '1d' scripts/qa-course-calendar-rpc.sql; } > "$file"
          printf 'GENERATED_MIGRATION=%s\n' "$file"
          sha256sum "$file"
      - uses: actions/upload-artifact@v4
        with:
          name: course-calendar-migration-draft
          path: supabase/migrations/*_course_calendar_read_snapshots.sql
          if-no-files-found: error
          retention-days: 7
